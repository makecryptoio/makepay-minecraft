backend:
  base-url: "https://your-backend.example.com/makepay"
  server-id: "survival-1"
  relay-token: ""
  checkout-path: "/minecraft/checkout"
  entitlements-path: "/minecraft/entitlements"
  ack-path: "/minecraft/entitlements/{id}/ack"
  connect-timeout-seconds: 10
  request-timeout-seconds: 20

poller:
  enabled: true
  interval-seconds: 30

messages:
  prefix: "&6[MakePay]&r "
  checkout-created: "&aCheckout ready: &b{url}"
  package-not-found: "&cUnknown package."
  no-packages: "&eNo MakePay packages are configured."
  entitlement-granted: "&aYour MakePay purchase was confirmed."

packages:
  vip:
    display-name: "VIP Rank"
    amount-minor: 999
    currency: "USD"
    description: "VIP rank for this server"
    commands:
      - "lp user {player} parent add vip"
      - "say {player} bought VIP with MakePay"
  credits-small:
    display-name: "Small Credit Pack"
    amount-minor: 499
    currency: "USD"
    description: "100 server credits"
    commands:
      - "eco give {player} 100"
